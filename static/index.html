<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>移民案件期限与材料管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    input { padding: .5rem; border: 1px solid #c4ccd4; border-radius: 6px; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    fieldset { border: 1px solid #d6dce2; border-radius: 8px; margin-top: 1rem; }
  </style>
</head>
<body>
<main>
  <h1>移民案件期限与材料管理</h1>
  <p>最小演示页。负责人为建案人；管理员/主管可凭页面版本号改派未结案件。</p>
  <div class="row">
    <label>调用身份 <input id="user" value="demo-admin"></label>
    <label>角色 <input id="role" value="admin"></label>
    <button id="load">加载记录</button>
    <button id="stats">查看状态统计</button>
  </div>

  <fieldset>
    <legend>改派案件（仅管理员/主管，案件未归档）</legend>
    <div class="row">
      <label>案件ID <input id="rid" size="6"></label>
      <label>页面版本号 <input id="version" size="6"></label>
      <label>新负责人 <input id="newOwner" placeholder="案件专员ID"></label>
      <label>原因 <input id="reason" placeholder="可选"></label>
      <button id="reassign">改派</button>
    </div>
  </fieldset>

  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
function currentHeaders() {
  return {"X-User-Id": document.getElementById("user").value || "demo-admin",
          "X-Role": document.getElementById("role").value || "admin",
          "X-Org": "demo"};
}
async function show(path, options) {
  const response = await fetch(path, options || {headers: currentHeaders()});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
document.getElementById("reassign").onclick = () => {
  const id = document.getElementById("rid").value.trim();
  const body = {
    expected_version: parseInt(document.getElementById("version").value, 10),
    new_owner_id: document.getElementById("newOwner").value.trim(),
    reason: document.getElementById("reason").value.trim()
  };
  show("/api/records/" + id + "/reassign", {
    method: "POST",
    headers: Object.assign({"Content-Type": "application/json"}, currentHeaders()),
    body: JSON.stringify(body)
  });
};
</script>
</body>
</html>
